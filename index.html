<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B1929">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    // Paint the saved theme onto <html> BEFORE anything else renders.
    // Without this, the TWA splash fades out onto a bare <body> (white) and stays
    // white until app.js runs render() and injects #app's markup — a bright flash
    // between the blue splash and the dark calculator. Kept in <head> and inline
    // on purpose: an external file would be one more round-trip before first paint.
    (function () {
      var BG = {
        midnight: ['#0B1929', '#0D2137'],
        rosewood: ['#1A0A14', '#1F0E19'],
        forest:   ['#0A1F12', '#0D2415'],
        lavender: ['#F5F0FF', '#EDE5FF'],
        highContrast: ['#000000', '#1a1a1a']
      };
      var key = 'midnight';
      try {
        var saved = JSON.parse(localStorage.getItem('easycalc_prefs'));
        if (saved && BG[saved.themeKey]) key = saved.themeKey;
      } catch (e) { }
      var c = BG[key];
      document.documentElement.style.background = c[0];
      // Match the status bar to the header now, not after render(), so it doesn't
      // step through a third colour on the way in.
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = c[1];
    })();
  </script>
  <meta name="description"
    content="TalkCalc - Accessible calculator for everyone. Voice input, large buttons, high contrast themes.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TalkCalc">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    rel="stylesheet">
  <title>TalkCalc - Voice Calculator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="app"></div>

  <!-- Paywall -->
  <div class="paywall-overlay" id="ec-paywall" onclick="if(event.target.id==='ec-paywall')ecClosePaywall()">
    <div class="paywall-sheet" id="pw-sheet">
      <button class="pw-close" onclick="ecClosePaywall()">&#x2715;</button>
      <div class="pw-badge">&#11088;</div>
      <div class="pw-title">Unlock TalkCalc Pro</div>
      <div class="pw-sub">One-time purchase &mdash; no subscription, yours forever.</div>
      <ul class="pw-features" id="pw-features">
        <li><span>&#128208;</span> Unit &amp; Currency Converter (<span id="pw-fx-count">31</span> currencies)</li>
        <li><span>%</span> Percentage Helper &mdash; Tip, Tax &amp; more</li>
        <li><span>&#128300;</span> Full Scientific Calculator</li>
        <li><span>&#128203;</span> Lists &mdash; groceries, rent, bill split</li>
        <li><span>&#11088;</span> Save &amp; share any result</li>
      </ul>
      <button class="pw-buy" id="pw-buy-btn" onclick="ecStartPurchase()">Unlock Pro &mdash; $2.99</button>
      <button class="pw-restore" onclick="ecRestorePurchase()">Restore previous purchase</button>
    </div>
  </div>

  <!-- CRITICAL: runs before iap.js and app.js to intercept keyboard listeners -->
  <script>
    (function () {
      const _orig = document.addEventListener.bind(document);
      document.addEventListener = function (type, handler, opts) {
        if (type === 'keydown' || type === 'keyup' || type === 'keypress' || type === 'input') {
          const wrapped = function (e) {
            if (document.activeElement && document.activeElement.closest && document.activeElement.closest('.pro-panel')) return;
            handler.call(this, e);
          };
          return _orig(type, wrapped, opts);
        }
        return _orig(type, handler, opts);
      };
      _orig('focusin', function (e) {
        if (e.target && e.target.closest && e.target.closest('.pro-panel')) {
          const mainInput = document.getElementById('textInput');
          if (mainInput) mainInput.blur();
        }
      }, true);
    })();
  </script>

  <!-- CRITICAL: runs before iap.js and app.js to intercept keyboard listeners -->
  <script>
    (function () {
      const _orig = document.addEventListener.bind(document);
      document.addEventListener = function (type, handler, opts) {
        if (type === 'keydown' || type === 'keyup' || type === 'keypress' || type === 'input') {
          const wrapped = function (e) {
            if (document.activeElement && document.activeElement.closest && document.activeElement.closest('.pro-panel')) return;
            handler.call(this, e);
          };
          return _orig(type, wrapped, opts);
        }
        return _orig(type, handler, opts);
      };
      _orig('focusin', function (e) {
        if (e.target && e.target.closest && e.target.closest('.pro-panel')) {
          const mainInput = document.getElementById('textInput');
          if (mainInput) mainInput.blur();
        }
      }, true);
      window.addEventListener('keydown', function (e) {
        // An open sheet gets first refusal, then keys are still blocked from the
        // calculator underneath — otherwise typing an amount would also drive the keypad.
        if (document.querySelector('.ec-sheet-ov')) {
          if (window.__ecSheetKey) window.__ecSheetKey(e);
          e.stopImmediatePropagation(); return;
        }
        const active = document.activeElement;
        if (active && active.closest && active.closest('.pro-panel')) {
          e.stopImmediatePropagation(); return;
        }
        const proIds = ['ec-panel-convert', 'ec-panel-pct', 'ec-panel-sci', 'ec-panel-notes'];
        const anyProVisible = proIds.some(id => {
          const el = document.getElementById(id);
          return el && el.classList.contains('active');
        });
        if (anyProVisible) e.stopImmediatePropagation();
      }, true);
    })();
  </script>

  <script src="js/iap.js"></script>
  <script src="js/app.js"></script>
  <script src="js/panels.js" defer></script>
</body>

</html>
